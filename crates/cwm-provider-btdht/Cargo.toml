[package]
name = "cwm-provider-btdht"
description = "BitTorrent DHT provider for cwm: resolve infohashes to peers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
cwm-core = { path = "../cwm-core" }
getrandom = "0.2"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
