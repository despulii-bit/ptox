[package]
name = "ptox"
description = "A language-neutral SDK for building file-search clients across many networks."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/despulii-bit/ptox"
documentation = "https://docs.rs/ptox"
readme = "README.md"
keywords = ["search", "file-search", "federation", "p2p", "sdk"]
categories = ["network-programming"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

async-trait = "0.1"
hex = { version = "0.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"], optional = true }
sha2 = { version = "0.11", optional = true }
toml = { version = "1.1", optional = true }

[features]
default = ["fetch"]
# Retrieval fabric (`Fetcher`, `FetchRegistry`, HTTP/command fetchers).
fetch = ["dep:hex", "dep:reqwest", "dep:sha2"]
# `ipfs://` retrieval through a configurable HTTP gateway (implies `fetch`).
# Opt-in: a network transport the core does not assume.
ipfs = ["fetch"]
# `file://` retrieval from the local filesystem (implies `fetch`). Off by
# default: it grants read access to any path the process can read.
file = ["fetch"]
# Canonical provider/fetcher configuration schema + TOML loader (implies `fetch`).
# Opt-in: client wiring, not core behavior.
config = ["dep:toml", "fetch"]

[[example]]
name = "rust_provider"
test = true

[[example]]
name = "config"
required-features = ["config"]
test = true

[[example]]
name = "client"
required-features = ["fetch"]
test = true

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
