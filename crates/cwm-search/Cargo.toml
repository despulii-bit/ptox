[package]
name = "cwm-search"
description = "cwm search engine: the SearchProvider contract and the fan-out engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-stream = "0.3"
cwm-types = { path = "../cwm-types" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
async-stream = "0.3"
cwm-types = { path = "../cwm-types" }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
