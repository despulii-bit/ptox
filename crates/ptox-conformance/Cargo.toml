[package]
name = "ptox-conformance"
description = "Contract conformance suite for ptox providers (in-process or NDJSON)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/despulii-bit/ptox"
documentation = "https://docs.rs/ptox-conformance"
keywords = ["search", "conformance", "testing", "p2p", "sdk"]
categories = ["development-tools::testing"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "ptox-conformance"
path = "src/main.rs"

[dependencies]
ptox = { version = "0.4", path = "../ptox", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
jsonschema = { version = "0.18", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
