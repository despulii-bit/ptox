[package]
name = "cwm"
description = "The cwm SDK: contracts, search engine, provider bridge, and retrieval."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

async-trait = "0.1"
hex = { version = "0.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["fetch"]
# Retrieval fabric (`Fetcher`, `FetchRegistry`, HTTP/command fetchers).
fetch = ["dep:hex", "dep:reqwest", "dep:sha2"]

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
