[package]
name = "cwm-conformance"
description = "Contract conformance suite for cwm providers (in-process or NDJSON)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cwm-conformance"
path = "src/main.rs"

[dependencies]
cwm-core = { path = "../cwm-core" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
async-stream = "0.3"
jsonschema = { version = "0.18", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
