[package]
name = "cwm-provider"
description = "cwm provider bridge: the NDJSON wire format and subprocess providers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-stream = "0.3"
cwm-search = { path = "../cwm-search" }
cwm-types = { path = "../cwm-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
cwm-search = { path = "../cwm-search" }
cwm-types = { path = "../cwm-types" }
futures = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
