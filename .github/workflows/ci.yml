name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Exercises off-by-default features (e.g. `file`), whose tests are not
      # compiled by the default-feature run above.
      - name: Test (all features)
        run: cargo test --workspace --all-features

  package:
    name: package (publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Proves the crate builds as it would be published, including the spec
      # files shipped inside `crates/ptox/spec`. Does not upload anything.
      - name: Publish dry-run
        run: cargo publish --dry-run -p ptox

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Broken intra-doc links and missing docs are build failures.
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  msrv:
    name: MSRV (${{ matrix.rust }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-features
    strategy:
      matrix:
        rust: ["1.88.0"]
